{% extends 'base.html' %}
{% block title %}Add Bandwidth | Kloud{% endblock %}
{% block page_title %}Bandwidth Confirmation{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header fw-semibold">{{ fr.customer_name }} — {{ fr.work_order_label }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Provider</label><select name="provider" class="form-select">{% for val,label in form.fields.provider.choices %}{% if val %}<option value="{{ val }}">{{ label }}</option>{% endif %}{% endfor %}</select></div>
            <div class="col-md-6"><label class="form-label">Status</label><select name="status" class="form-select">{% for val,label in form.fields.status.choices %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
            <div class="col-md-6"><label class="form-label">Requested (Mbps)</label><input name="requested_capacity" type="number" class="form-control" value="{{ form.requested_capacity.value|default:fr.requested_capacity }}"></div>
            <div class="col-md-6"><label class="form-label">Available (Mbps)</label><input name="available_capacity" type="number" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Date</label><input name="confirmation_date" type="date" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Reference #</label><input name="provider_reference" class="form-control"></div>
            <div class="col-12"><label class="form-label">Remarks</label><textarea name="remarks" rows="2" class="form-control"></textarea></div>
          </div>
          <div class="d-flex gap-2 justify-content-end mt-3">
            <a href="{% url 'feasibility:onboarding_detail' fr.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
