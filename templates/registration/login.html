<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Kloud ISP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a2035, #2d3559); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border-radius: 16px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card login-card">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h3 class="text-primary fw-bold">&#9729; Kloud ISP</h3>
            <p class="text-muted small">Feasibility & Sales Confirmation System</p>
          </div>
          {% if form.errors %}
          <div class="alert alert-danger">Invalid username or password.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control" autofocus required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
